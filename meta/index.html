<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta - Codebase Analysis | Steven Xu</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
</head>
<body>
    <h1>Codebase Evolution</h1>
    <p>Scroll down to see the story of how my website's code was built, commit by commit.</p>

    <div id="stats"></div>

    <div id="scrolly-1">
        <div id="scatter-story">
            </div>

        <div id="scatter-plot">
            <div id="scatterplot-container">
                <svg id="scatterplot" viewBox="0 0 800 500"></svg>
                
                <div id="commit-tooltip" class="tooltip hidden">
                    <dl id="commit-info"></dl>
                </div>
            </div>
        </div>
    </div>

    <h2 style="margin-top: 4rem;">File Architecture</h2>
    <p>A breakdown of the codebase by file. Each dot represents a single line of code.</p>
    <dl id="files"></dl>

    <script src="main.js" type="module" defer></script>
</body>
</html>
