<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta - Codebase Analysis | Steven Xu</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
</head>
<body>
    <h1>Codebase Evolution</h1>
    <p>Scroll down to explore the interactive narrative of how this website's codebase was engineered.</p>

    <div id="stats"></div>

    <div id="scrolly-1">
        <div id="scatter-story">
            </div>

        <div id="scatter-plot">
            <label id="commit-filter">
                Show commits until:
                <input type="range" id="commit-progress" min="0" max="100" value="100">
                <time id="commit-time"></time>
            </label>

            <div id="scatterplot-container">
                <svg id="scatterplot" viewBox="0 0 800 500"></svg>
                
                <div id="commit-tooltip" class="tooltip hidden">
                    <dl id="commit-info"></dl>
                </div>
            </div>
        </div>
    </div>

    <div id="scrolly-2">
        <div id="files-story">
            </div>

        <div id="files-plot">
            <h2>File Architecture</h2>
            <p>Tracking code volume across individual files. Each dot represents a single line of code, colored by technology.</p>
            <dl id="files"></dl>
        </div>
    </div>

    <script src="main.js" type="module" defer></script>
</body>
</html>
